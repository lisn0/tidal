name: search-ping

# Submits the sitemap to IndexNow (Bing/Yandex/Naver/Seznam) and re-submits it
# to Google Search Console.
#
# Deliberately NOT on `push`. Two reasons:
#   1. This is a periodic concern, not a per-commit one. Google discovers pages
#      from the sitemap already declared in robots.txt, so a push adds nothing
#      Google cares about, and IndexNow only reaches the other engines.
#   2. As a per-push check it was a guaranteed red X: a GitHub billing lock
#      kills the job before a runner picks it up, so every content push since
#      2026-08-15 failed without a single step running. Noise that trains you to
#      ignore red is worse than no check.
#
# Manual dispatch is the "I just deployed" path. The sleep below is only load-
# bearing for that case - a scheduled run is long past deploy - but it is one
# line, so it stays rather than growing a conditional.
on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare deploy
        run: sleep 180

      # IndexNow key is public by design (ownership = hosting /<key>.txt)
      - name: IndexNow (Bing, Yandex, Naver, Seznam)
        env:
          INDEXNOW_HOST: llmcfo.com
          INDEXNOW_KEY: 9f7a91c496064b7e96137c3326d9b895
          INDEXNOW_SITEMAP: https://llmcfo.com/sitemap.xml
        run: node scripts/indexnow-submit.mjs

      - name: Google Search Console sitemap resubmit
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          GSC_SITE: sc-domain:llmcfo.com
          GSC_SITEMAPS: https://llmcfo.com/sitemap.xml
        run: node scripts/gsc-sitemap-submit.mjs
